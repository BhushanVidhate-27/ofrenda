<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="A paper portrait silhouette wreathed in marigolds">
  <defs>
    <radialGradient id="paper" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#f6ead2"/>
      <stop offset="0.62" stop-color="#e9d7b8"/>
      <stop offset="1" stop-color="#d8c09b"/>
    </radialGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2418"/>
      <stop offset="1" stop-color="#24150e"/>
    </linearGradient>
    <radialGradient id="flower" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.55" stop-color="#e8972f"/>
      <stop offset="1" stop-color="#b8452c"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#paper)"/>
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#b08a5c" stroke-opacity="0.5" stroke-width="1.4"/>
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#b08a5c" stroke-opacity="0.28" stroke-width="1"/>

  <path d="M96 560c0-128 84-208 204-208s204 80 204 208v158H96Z" fill="#e5d2b1"/>
  <path d="M96 560c0-128 84-208 204-208s204 80 204 208" fill="none" stroke="#c09a6a" stroke-opacity="0.55" stroke-width="1.2"/>

  <g fill="url(#silhouette)">
