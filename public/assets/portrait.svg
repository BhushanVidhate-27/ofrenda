  <g fill="#8a5a2a" opacity="0.45">
    <circle cx="92" cy="132" r="2.2"/><circle cx="512" cy="176" r="1.8"/>
    <circle cx="466" cy="96" r="2"/><circle cx="142" cy="220" r="1.6"/>
    <circle cx="520" cy="640" r="2"/><circle cx="78" cy="606" r="1.7"/>
