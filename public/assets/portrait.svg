    <g transform="translate(470 702) scale(0.9)">
      <circle r="9" fill="url(#flower)"/>
      <circle cx="-17" cy="8" r="8" fill="url(#flower)"/>
      <circle cx="17" cy="8" r="8" fill="url(#flower)"/>
      <circle cx="-9" cy="-16" r="7" fill="url(#flower)"/>
      <circle cx="11" cy="-15" r="7" fill="url(#flower)"/>
      <circle r="4" fill="#7a3b16"/>
