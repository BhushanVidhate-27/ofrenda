    <path d="M243 330c0-64 26-108 57-108s57 44 57 108c0 18-4 30-10 38-6-50-20-78-47-78s-41 28-47 78c-6-8-10-20-10-38Z" opacity="0.92"/>
    <path d="M300 436c-76 0-128 46-146 118-10 40-14 78-14 118h320c0-40-4-78-14-118-18-72-70-118-146-118Z"/>
    <path d="M214 520c30 22 62 34 86 34s56-12 86-34c6 34 8 68 8 96H206c0-28 2-62 8-96Z" opacity="0.55"/>
